perex: This document describes the data format used to provide warnings of hazardous weather and poor driving conditions detected by road weather stations – for example dense fog, strong wind, ice or heavy precipitation. A warning is created when a measured value exceeds a defined threshold, is valid for 20 minutes and is renewed while the phenomenon lasts. The location is given by a reference to the predefined section of the weather station in the location set of the format x-format:cz-ndic_d2-pls-v2.0. The format is based on the sit:SituationPublication of the DATEX II 3.7 model; it does not contain regularly measured weather data.
keywords: DATEX II, NDIC, SituationPublication
